name: UI screenshot and emulator smoke
on:
  pull_request:
    paths:
      - 'app/**'
      - 'tools/emulator-smoke.sh'
      - '.github/workflows/emulator-smoke.yml'
  workflow_dispatch:
concurrency:
  group: emulator-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APK to install on emulator
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
          gradle :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Run emulator and capture UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash tools/emulator-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timelapse-emulator-ui
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 7
