name: Pure Kotlin reliability policy tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Progress tracker consistency
        run: python3 tools/progress.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Kotlin CLI compiler
        id: kotlin-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kotlinc
          key: kotlin-cli-2.0.21-${{ runner.os }}
      - name: Install Kotlin CLI on cache miss
        if: steps.kotlin-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin-compiler.zip -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/kotlinc/bin/kotlinc"
      - name: Add cached Kotlin CLI to PATH
        run: echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash tools/test-policy.sh
      - name: Upload self-contained Markdown handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timelapse-master-handoff-md
          path: docs/HANDOFF_MASTER_2026-10-30.md
          if-no-files-found: error
          retention-days: 14
