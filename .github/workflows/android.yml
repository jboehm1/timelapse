name: Android APK and unit tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Progress tracker consistency
        run: python3 tools/progress.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK and test (capture diagnostic logs)
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee gradle-build.log
      - name: Upload build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-diagnostics
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: timelapse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
